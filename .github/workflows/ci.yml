name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint and security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Unit tests (race detector)
        run: go test -race -timeout 120s ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m

      - name: Security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...

      - name: Build
        run: go build ./...

  build-and-push:
    name: Build and push image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tags
        id: set-image
        run: |
          # ghcr.io image names are case-sensitive: force lowercase
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Detected tag push: ${TAG_NAME}"
          echo "image-tag=${IMAGE_NAME}:${TAG_NAME},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.set-image.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
