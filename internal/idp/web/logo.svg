<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="minidp" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>minidp</title>
  <defs>
    <radialGradient id="node-fill" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="var(--logo-node-hi)"/>
      <stop offset="100%" stop-color="var(--logo-node-lo)"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --logo-ring-1: #0d8570;
      --logo-ring-2: #12987f;
      --logo-ring-3: #18b39d;
      --logo-node-hi: #2ad1b8;
      --logo-node-lo: #0a6d5b;
      --logo-glow: rgba(15, 138, 114, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-ring-1: #18b39d;
        --logo-ring-2: #22c3ab;
        --logo-ring-3: #2ad1b8;
        --logo-node-hi: #6be9d6;
        --logo-node-lo: #18b39d;
        --logo-glow: rgba(42, 209, 184, 0.45);
      }
    }
    .ring { fill: none; stroke-linecap: round; }
  </style>

  <!-- outer ripple, widest gap = most "dissolved" -->
  <circle class="ring" cx="60" cy="60" r="46"
          stroke="var(--logo-ring-1)" stroke-width="2.5" opacity="0.55"
          stroke-dasharray="230 59" transform="rotate(-24 60 60)"/>

  <!-- middle ripple -->
  <circle class="ring" cx="60" cy="60" r="34"
          stroke="var(--logo-ring-2)" stroke-width="3" opacity="0.8"
          stroke-dasharray="166 48" transform="rotate(52 60 60)"/>

  <!-- inner ripple, closest to node, tightest and most solid -->
  <circle class="ring" cx="60" cy="60" r="22"
          stroke="var(--logo-ring-3)" stroke-width="3.5" opacity="1"
          stroke-dasharray="102 36" transform="rotate(-96 60 60)"/>

  <!-- center node: the verified identity -->
  <circle cx="60" cy="60" r="9" fill="url(#node-fill)" filter="url(#glow)"
          style="filter: drop-shadow(0 0 6px var(--logo-glow))"/>
</svg>
