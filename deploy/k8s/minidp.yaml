# Minimal production deployment of minidp for a single-user demo of
# rego-adventure.
#
# Key management: by default the signing key is generated on first start into
# an emptyDir and is LOST when the pod is rescheduled (users simply log in
# again — acceptable for a demo). For stability across reschedules, generate
# the key once, put the PEM into a Secret and mount it, then set
# IDP_RSA_PEM=/keys/minidp-rsa.pem instead of IDP_KEY_DIR (see commented
# block below).
---
apiVersion: v1
kind: Service
metadata:
  name: minidp
  labels:
    app: minidp
spec:
  selector:
    app: minidp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidp
  labels:
    app: minidp
spec:
  replicas: 1
  strategy:
    type: Recreate # single-writer: key dir is per-pod state
  selector:
    matchLabels:
      app: minidp
  template:
    metadata:
      labels:
        app: minidp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: minidp
          image: minidp:latest # replace with your registry path
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: IDP_ISSUER
              value: https://idp.example.com # must be the URL browsers reach
            # Single registered client; tokens carry aud=rego-adventure and
            # both /authorize and /token reject every other client_id.
            - name: IDP_CLIENT_ID
              value: rego-adventure
            - name: IDP_AUDIENCE
              value: rego-adventure
            # Registered redirect URIs of the client (mandatory — minidp
            # refuses to start without a redirect policy).
            - name: ALLOWED_REDIRECTS
              value: https://adventure.example.com/callback
            # Accounts come from a users-file Secret (bcrypt hashes, managed
            # with minidp-users); there are no built-in credentials.
            - name: IDP_USERS_FILE
              value: /config/users.json
            - name: IDP_KEY_DIR
              value: /data
            # Behind an ingress, trust its network so rate limiting sees real IPs:
            # - name: TRUSTED_PROXIES
            #   value: 10.0.0.0/8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: users
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: data
          emptyDir: {}
        - name: users
          secret:
            secretName: minidp-users
            items:
              - key: users.json
                path: users.json
          # For key stability across pod reschedules, mount a Secret instead:
          # - name: keys
          #   secret: { secretName: minidp-key }
          # and replace the IDP_KEY_DIR env with:
          # - name: IDP_RSA_PEM
          #   value: /keys/minidp-rsa.pem
          # plus mount "keys" at /keys (readOnly).
---
# Example secret — create it properly with kubectl, do not commit real
# credentials. Build the file with the bundled tool (never prints hashes):
#
#   minidp-users add -file users.json -username rego -email rego@example.com
#   kubectl create secret generic minidp-users --from-file=users.json=users.json
